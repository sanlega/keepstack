name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4
      - run: ruff check .

  pre-commit-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the hook the way other repositories use it
        run: |
          pip install pre-commit
          demo="$RUNNER_TEMP/demo" && mkdir -p "$demo" && cp examples/quickstart/main.tf "$demo/"
          cd "$demo" && git init -q && git add -A
          pre-commit try-repo "$GITHUB_WORKSPACE" keepstack-check --all-files

  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Smoke test the CLI
        run: |
          keepstack --version
          keepstack env --shell sh
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_[!e]*.py" -v  # everything except the e2e suites

  e2e:
    name: end-to-end (Docker + Terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false  # the wrapper changes exit codes, which the tests assert on
      - name: End-to-end tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_e2e tests.test_e2e_daemon tests.test_e2e_compact tests.test_e2e_shims tests.test_e2e_dashboard tests.test_e2e_validate -v
